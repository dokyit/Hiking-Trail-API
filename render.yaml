services:
  # PostgreSQL Database with PostGIS
  - type: pserv
    name: hiking-trail-db
    plan: free
    region: oregon
    databaseName: hiking_db
    databaseUser: hiking_user

  # Redis Cache
  - type: redis
    name: hiking-trail-cache
    plan: free
    region: oregon
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

  # Backend Flask API
  - type: web
    name: hiking-trail-backend
    runtime: python
    plan: free
    region: oregon
    branch: main
    buildCommand: ./build.sh
    startCommand: gunicorn -w 4 -b 0.0.0.0:$PORT run:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: DATABASE_URL
        fromDatabase:
          name: hiking-trail-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: hiking-trail-cache
          type: redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: GOOGLE_MAPS_KEY
        sync: false
      - key: WEATHERSTACK_KEY
        sync: false
      - key: FLASK_ENV
        value: production

  # Frontend React Static Site
  - type: web
    name: hiking-trail-frontend
    runtime: static
    plan: free
    region: oregon
    branch: main
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/build
    pullRequestPreviewsEnabled: true
    envVars:
      - key: REACT_APP_GOOGLE_MAPS_KEY
        sync: false
      - key: REACT_APP_API_URL
        fromService:
          name: hiking-trail-backend
          type: web
          property: host
